<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập</title>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
  --accent:#b91c1c; --line:#e5e0d5; --shadow:0 2px 10px rgba(0,0,0,.07);
}
body.dark{
  --bg:#141210; --card:#1f1c18; --ink:#e9e2d6; --muted:#a8a094;
  --accent:#f87171; --line:#38322a; --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
.wrap{max-width:880px;margin:0 auto;padding:28px 16px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
h1{font-family:"Times New Roman",Times,serif;font-weight:700;font-size:2.2rem;margin:0;color:var(--accent)}
.sub{color:var(--muted);font-size:.95rem;margin:6px 0 22px}
.theme-btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.9rem;box-shadow:var(--shadow);text-decoration:none;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--ac);border-radius:12px;padding:18px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.code{align-self:flex-start;font-size:.75rem;font-weight:700;letter-spacing:.6px;color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent);border-radius:6px;padding:3px 10px;margin-bottom:10px}
.card h2{font-family:"Times New Roman",Times,serif;font-weight:700;font-size:1.35rem;margin:0 0 6px;line-height:1.35}
.meta{font-size:.86rem;color:var(--muted);margin:0 0 14px}
.prog{margin-top:auto}
.prow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ptext{font-size:.84rem;color:var(--muted);margin:0}
.ptext b{color:var(--ac)}
.pct{font-size:.84rem;font-weight:700;color:var(--ac)}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,transparent);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:99px;transition:width .4s}
.note{margin-top:30px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Ôn tập</h1>
    <div style="display:flex;gap:8px">
      <a class="theme-btn" href="app/#his362?tab=gopy&mon=all" title="Góp ý / Báo lỗi">Góp ý</a>
      <button class="theme-btn" id="themeBtn" title="Đổi giao diện sáng/tối">Sáng / Tối</button>
    </div>
  </header>
  <p class="sub">5 môn &middot; 334 câu trắc nghiệm &middot; chọn môn để bắt đầu ôn. Tiến độ mỗi môn được lưu riêng trên máy này.</p>
  <div class="grid" id="grid"></div>
  <p class="note">Nhắc nhỏ: đáp án được tra cứu và đối chiếu từ nhiều nguồn, dù đã rà soát kỹ vẫn có thể còn sai sót. Khi ôn thi, bạn nên đối chiếu thêm với giáo trình và đáp án của giảng viên.</p>
</div>
<script>
const SUBJECTS=[
 {code:"HIS362",name:"Lịch sử Đảng Cộng sản Việt Nam",href:"app/#his362",ac:"#b91c1c",key:"lsd-quiz-v1", stats:"45 trắc nghiệm · 30 câu hỏi ngắn · 5 dàn ý tự luận · 31 mốc timeline"},
 {code:"POS361",name:"Tư tưởng Hồ Chí Minh",href:"app/#pos361",ac:"#c2410c",key:"hcm-quiz-v1", stats:"90 trắc nghiệm · 40 câu hỏi ngắn · 5 dàn ý tự luận"},
 {code:"POS351",name:"Chủ nghĩa xã hội khoa học",href:"app/#pos351",ac:"#15803d",key:"cnxh-quiz-v1",stats:"105 trắc nghiệm · 30 câu hỏi ngắn · 5 dàn ý tự luận"},
 {code:"CS434",name:"Công cụ & Phương pháp Thiết kế - Quản lý (Phần mềm)",href:"app/#cs434",ac:"#7c3aed",key:"cs434-quiz-v1",stats:"74 trắc nghiệm · 12 câu trả lời ngắn"},
 {code:"CS420",name:"Hệ Phân tán",href:"app/#cs420",ac:"#1d4ed8",key:"cs420-quiz-v1",stats:"100 trắc nghiệm · 9 bài thực hành"}
];
const grid=document.getElementById("grid");
SUBJECTS.forEach(s=>{
  let done=0,total=0;
  try{
    const d=JSON.parse(localStorage.getItem(s.key)||"null");
    if(d){done=(d.done||[]).length;total=d.n||0;}
  }catch(e){}
  const pct=total?Math.round(done/total*100):0;
  const el=document.createElement("a");
  el.className="card"; el.href=s.href; el.style.setProperty("--ac",s.ac);
  el.innerHTML='<span class="code">'+s.code+'</span><h2>'+s.name+'</h2>'
    +'<p class="meta">'+s.stats+'</p>'
    +'<div class="prog"><div class="prow"><p class="ptext">Đã làm <b>'+done+'</b>/'+total+'</p><span class="pct">'+pct+'%</span></div>'
    +'<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  grid.appendChild(el);
});
const btn=document.getElementById("themeBtn");
btn.onclick=()=>{document.body.classList.toggle("dark");
  try{localStorage.setItem("study-theme",document.body.classList.contains("dark")?"d":"l");}catch(e){}};
try{if(localStorage.getItem("study-theme")==="d")document.body.classList.add("dark");}catch(e){}
</script>
</body>
</html>
